name: Sync fragment roster

on:
  schedule:
    - cron: '17 */12 * * *'   # 北京时间每 12 小时 17 分
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch BWiki combat roster and sync checkbox cases
        run: |
          echo "Current Date and Time: $(date '+%Y-%m-%d %H:%M:%S')"
          python tools/ci/update_fragment_roster.py

      - name: Check if roster files changed
        id: check
        run: |
          if [[ -n "$(git status --porcelain -- assets/resource/data/fragment-roster.json assets/resource/tasks/日常任务.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resource/data/fragment-roster.json assets/resource/tasks/日常任务.json
          git commit -m "chore: sync mystery-shop fragment roster from BWiki"
          git pull origin $(git rev-parse --abbrev-ref HEAD) --rebase
          git push
