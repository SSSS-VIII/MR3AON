name: Sync fragment roster

# 刷新神秘商店勾玉碎片 GUI 待选项（仅手动）。
#
# 唯一维护处: assets/resource/tasks/日常任务.json
#   → option「勾玉购买忍者碎片」.cases
# Agent 不读名单，只买框架写入 attach 的已选项。
#
# BWiki 已有新角色: Actions → Sync fragment roster → Run workflow
# BWiki 未更新: 直接在上述 cases 里追加一项后发版
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch BWiki combat names into checkbox cases
        run: |
          echo "Current Date and Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Updates: assets/resource/tasks/日常任务.json option 勾玉购买忍者碎片"
          python3 tools/ci/update_fragment_roster.py

      - name: Check if task options changed
        id: check
        run: |
          if [[ -n "$(git status --porcelain -- assets/resource/tasks/日常任务.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- assets/resource/tasks/日常任务.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resource/tasks/日常任务.json
          git commit -m "chore: sync mystery-shop fragment options from BWiki"
          git pull origin "$(git rev-parse --abbrev-ref HEAD)" --rebase
          git push
