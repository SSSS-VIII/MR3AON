name: Sync fragment roster

# 神秘商店勾玉碎片名单（仅手动）。
#
# 唯一源: assets/resource/data/fragment-roster.json → names
# 派生: 日常任务.json 里「勾玉购买忍者碎片」勾选 cases（本 workflow / 脚本生成，勿手改）
#
# 用法:
#   Actions → Sync fragment roster → Run workflow（BWiki 已有新角色时）
#   若 BWiki 还没收录: 先改源文件 names，本地跑
#     python3 tools/ci/update_fragment_roster.py --sync-tasks-only
#   再提交源文件与 日常任务.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch BWiki combat roster and sync checkbox cases
        run: |
          echo "Current Date and Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Source of truth: assets/resource/data/fragment-roster.json"
          python3 tools/ci/update_fragment_roster.py

      - name: Check if roster files changed
        id: check
        run: |
          if [[ -n "$(git status --porcelain -- assets/resource/data/fragment-roster.json assets/resource/tasks/日常任务.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- assets/resource/data/fragment-roster.json assets/resource/tasks/日常任务.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit (roster already up to date)"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resource/data/fragment-roster.json assets/resource/tasks/日常任务.json
          git commit -m "chore: sync mystery-shop fragment roster from BWiki"
          git pull origin "$(git rev-parse --abbrev-ref HEAD)" --rebase
          git push
